<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart-style Image Slider</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f1f3f6;
      display: flex;
      justify-content: center;
    }

    /* Carousel Wrapper */
    .carousel-container {
      position: relative;
      width: 800px;
      max-width: 100%;
    }

    /* 1. The Slider Row */
    .slider {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      /* Configures snap alignment horizontally */
      scroll-snap-type: x mandatory; 
      /* Hides the scrollbar across browsers */
      scrollbar-width: none; 
    }
    .slider::-webkit-scrollbar {
      display: none;
    }

    /* 2. Individual Poster Cards */
    .slide {
      flex: 0 0 100%; /* Each image takes full width of container */
      scroll-snap-align: start; /* Snaps the image perfectly in place */
      box-sizing: border-box;
    }

    .slide img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      border-radius: 4px;
    }

    /* 3. Navigation Controls */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: white;
      color: #333;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
      width: 40px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border-radius: 4px;
      z-index: 10;
    }

    .prev { left: 0; }
    .next { right: 0; }
    .nav-btn:hover { background-color: #f9f9f9; }
  </style>
</head>
<body>

  <div class="carousel-container">
    <!-- The Slider Wrapper -->
    <div class="slider">
      <!-- Slide 1 -->
      <div class="slide" id="img1">
        <a href="#img3" class="nav-btn prev">&lsaquo;</a>
        <img src="https://picsum.photos/800/300?random=1" alt="Poster 1">
        <a href="#img2" class="nav-btn next">&rsaquo;</a>
      </div>

      <!-- Slide 2 -->
      <div class="slide" id="img2">
        <a href="#img1" class="nav-btn prev">&lsaquo;</a>
        <img src="https://picsum.photos/800/300?random=2" alt="Poster 2">
        <a href="#img3" class="nav-btn next">&rsaquo;</a>
      </div>

      <!-- Slide 3 -->
      <div class="slide" id="img3">
        <a href="#img2" class="nav-btn prev">&lsaquo;</a>
        <img src="https://picsum.photos/800/300?random=3" alt="Poster 3">
        <a href="#img1" class="nav-btn next">&rsaquo;</a>
      </div>
    </div>
  </div>

</body>
</html>
